name: 判定の誤り
description: 誤検知・見逃し・重大度や行の誤りを報告する
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        このリポジトリは公開している。業務のコードは貼らず、同じ形を保った別のコードに書き換えてから載せる。
  - type: dropdown
    id: kind
    attributes:
      label: 種類
      options:
        - 誤検知（出るべきでない指摘が出た）
        - 見逃し（出るべき指摘が出なかった）
        - 重大度か指摘の行が違う
    validations:
      required: true
  - type: input
    id: check
    attributes:
      label: チェックID
      placeholder: CA-DEP-01
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: 再現するコード
      description: 最小の例。ファイルが複数あるときは、パスを添えて並べる
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
      description: "`bin/sumidashi review --format json` の該当する指摘"
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン
      description: plugin.json の version か、コミットのハッシュ
