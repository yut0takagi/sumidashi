# モデルの共通化のチェック項目（6個）
# 共通化すべきものの見落とし（MDL-01〜04・06）と、誤った共通化（MDL-05）の両方向を見る。
# 共通化を勧めるのは、同じコンテキスト・同じ概念・同じ変更理由の3条件をすべて満たすときだけ。
# 1チェック=1エントリ。id は一度振ったら変えない。
# スキーマ: schemas/checks-file.schema.json

philosophy:
  id: model-commonality
  name: モデルの共通化
  summary: 共通化すべきモデルの見落としと、誤った共通化
  release: v1
  id_prefixes: [MDL]

sources:
  - id: hunt-thomas-1999
    title: "The Pragmatic Programmer: From Journeyman to Master"
    author: Andrew Hunt, David Thomas
    year: 1999
  - id: evans-2003
    title: "Domain-Driven Design: Tackling Complexity in the Heart of Software"
    author: Eric Evans
    year: 2003
  - id: fowler-2018
    title: "Refactoring: Improving the Design of Existing Code (2nd Edition)"
    author: Martin Fowler
    year: 2018
  - id: fowler-2002
    title: Patterns of Enterprise Application Architecture
    author: Martin Fowler
    year: 2002
  - id: metz-2016
    title: The Wrong Abstraction
    author: Sandi Metz
    year: 2016
    url: https://sandimetz.com/blog/2016/1/20/the-wrong-abstraction

principles:
  - id: mdl.single-source-of-knowledge
    statement: 同じ業務知識（概念・計算・ルール）は、1つのコンテキストの中で1か所にだけ表す
    sources: [hunt-thomas-1999]
  - id: mdl.no-false-unification
    statement: 形が同じでも、意味・コンテキスト・変更理由が違うものは1つにまとめない
    sources: [metz-2016, evans-2003]
  - id: mdl.cohesive-value-types
    statement: いつも一緒に扱う値の組と、取りうる値が決まった区分には、型として名前を付ける
    sources: [fowler-2018, fowler-2002]
  - id: mdl.shared-kernel
    statement: 共有カーネルとして合意した型は、各所で再定義せずにそれを使う
    sources: [evans-2003]

checks:
  - id: MDL-01
    name: 同じ概念を表す型が重複して定義されている
    principle: 同じコンテキストの同じ概念は1つの型で表し、写しの型を作らない
    principles: [mdl.single-source-of-knowledge]
    source: Hunt & Thomas『The Pragmatic Programmer』DRY／Evans『Domain-Driven Design』14章 Maintaining Model Integrity
    status: draft
    release: v1
    applies_when:
      layers: [domain, application]
      languages: [typescript, python]
      requires: [layer_map]
    detection:
      type: hybrid
      static: >-
        同じコンテキスト（ディレクトリで対応づける）のドメイン層・アプリケーション層の型について、
        フィールド名の集合の Jaccard 係数が 0.7 以上の型の組を候補にする。用語集があれば、
        両方の型名が同じ用語の code_names・synonyms_deprecated に入るかを併せて調べる
      question: >-
        この2つの型は同じ業務概念を表し、同じ業務ルールの変更で両方を直す必要があるか
        （形が似ているだけの別の概念ではないか）。
    location: 型の組のうち、パスと行の昇順で2つ目の型の宣言の行
    criteria:
      violation: >-
        同じコンテキストで、同じ概念を表す型が2つ以上ある（フィールド名の集合の Jaccard 係数が 0.7 以上で、
        同じコンテキスト・同じ概念・同じ変更理由の3条件を満たす）
      borderline: >-
        用語集がなく、LLM が書き出した2つの型の定義文が一致するかを言い回しだけでは決められない。
        または片方が読み取り専用の投影（クエリモデル）として、意図して分けられた可能性がある
      not_violation: >-
        別のコンテキストの同名・同形の型。DTO とドメインの型のように、層の違いで役割が分かれた型。
        形が同じでも変更理由が違う型（偶然の重複）
    exclusions:
      - テストコード
      - 生成コード
      - DTO・ORM モデル・外部 API の型と、ドメインの型との組
    severity:
      default: Medium
    fix_patterns:
      - 一方の型に寄せ、もう一方の利用箇所を置き換える
      - 片方が投影なら、投影であることを名前（〜View・〜Summary など）とコメントで明示する
    related: [MDL-05, MDL-06, GLO-02]
    fixtures:
      violation: []
      borderline: []
      not_violation: []

  - id: MDL-02
    name: 同じ業務計算が複数の場所で別々に実装されている
    principle: 1つの業務計算（税込金額、ポイント付与、手数料など）は1か所で実装し、ほかの場所はそれを呼ぶ
    principles: [mdl.single-source-of-knowledge]
    source: Hunt & Thomas『The Pragmatic Programmer』DRY
    status: draft
    release: v1
    applies_when:
      layers: [any]
      languages: [typescript, python]
    detection:
      type: hybrid
      static: >-
        コードクローン検出（jscpd など）で、算術演算・丸め・条件分岐を含むクローンの組を候補にする。
        あわせて、同じ数値リテラル（税率・手数料率など）を使う計算式の組を候補にする
      question: >-
        この2つのコードは、同じ業務上の計算（同じ業務ルールの変更で両方を直すべき計算）を、
        それぞれ別々に実装しているか。
    location: 実装の組のうち、パスと行の昇順で2つ目の実装の行範囲
    criteria:
      violation: 同じ業務計算が2か所以上で別々に実装されている
      borderline: >-
        計算式は同じだが、業務上同じ計算か（2つの「手数料」が同じ規約に基づくかなど）が、
        コードの外にしか書かれていない
      not_violation: 一方が他方を呼んでいる（実装は1か所）。式の形が同じでも、業務上の意味が違う計算（偶然の重複）
    exclusions:
      - テストコード（期待値を計算する式）
      - 生成コード
    severity:
      default: High
    fix_patterns:
      - 計算をドメインの1か所（値オブジェクトのメソッドかドメインサービス）にまとめ、両方の利用箇所からそれを呼ぶ
    related: [BIZ-02, MDL-03, DDD-VO-03]
    fixtures:
      violation: []
      borderline: []
      not_violation: []

  - id: MDL-03
    name: 値オブジェクトにすべき値の組がバラの引数で散らばっている
    principle: いつも一緒に扱い、組としての制約を持つ値は、値オブジェクトにまとめる
    principles: [mdl.cohesive-value-types, ddd.explicit-domain-types]
    source: Fowler『Refactoring』Data Clumps、Introduce Parameter Object／Fowler『Patterns of Enterprise Application Architecture』Money
    status: draft
    release: v1
    applies_when:
      layers: [domain, application]
      languages: [typescript, python]
      requires: [layer_map]
    detection:
      type: hybrid
      static: >-
        関数・メソッドの引数とクラスのフィールドから、同じ名前の組（amount と currency、start と end、
        from と to、lat と lng など2つ以上の名前の組）が3か所以上に出るものを列挙する
      question: >-
        この値の組は業務上いつも一緒に扱われ、組としての制約（通貨が同じこと、開始が終了より前であることなど）
        を持つか。
    location: 組が出る箇所のうち、パスと行の昇順で最初の関数・フィールドの宣言の行（ほかの箇所は evidence に並べる）
    criteria:
      violation: 金額と通貨、開始日と終了日など、いつも一緒に扱う値の組が、バラの引数かフィールドで3か所以上に出る
      borderline: 3か所以上に出るが、そのうち一部は外部 API の型や DTO で、ドメインの中で組として扱っているのは2か所以下
      not_violation: 組がすでに値オブジェクトになっている。名前は並ぶが組としての制約がない（偶然同じ引数が並ぶだけ）
    exclusions:
      - テストコード
      - 外部 API・ORM の型の定義そのもの
    severity:
      default: Medium
    fix_patterns:
      - 組を値オブジェクト（Money・DateRange・Coordinates など）にまとめ、組の制約をコンストラクタで検証する
    related: [DDD-VO-03, DDD-VO-01, MDL-02]
    fixtures:
      violation: []
      borderline: []
      not_violation: []

  - id: MDL-04
    name: 状態・区分が文字列や数値のリテラルのまま散らばっている
    principle: 状態や区分は列挙型か値オブジェクトとして定義し、リテラルの比較を各所に書かない
    principles: [mdl.cohesive-value-types, mdl.single-source-of-knowledge]
    source: Fowler『Refactoring』Primitive Obsession、Replace Primitive with Object
    status: draft
    release: v1
    applies_when:
      layers: [any]
      languages: [typescript, python]
    detection:
      type: static
      static: >-
        同じ文字列リテラル・数値リテラルが、比較（===・==・!==・in・switch の case・match の case）の相手として
        3か所以上に出るものを列挙する。比較の相手の識別子の名前が status・state・type・kind・category・role・
        phase を含むものに限る
    location: 同じリテラルの比較のうち、パスと行の昇順で最初の比較の行（ほかの箇所は evidence に並べる）
    criteria:
      violation: 状態や区分が文字列・数値リテラルのまま、2つ以上のファイルの3か所以上で比較されている
      borderline: 3か所以上で比較されているが、すべて1つのファイルの中にある（1つのモジュールに閉じた区分）
      not_violation: >-
        列挙型（TypeScript の enum、Python の Enum）・定数で比較している。比較する変数がリテラル型の
        ユニオンとして宣言されている（TypeScript で網羅性の検査が効くもの）。比較が2か所以下
    exclusions:
      - テストコード
      - HTTP ステータス・環境名など、業務の区分ではない値（比較の相手の名前で判定する）
      - 外部 API の応答を、アダプタ層で一度だけ内部の区分に変換している箇所
    severity:
      default: Medium
    fix_patterns:
      - 区分を列挙型か値オブジェクトにし、状態による判断をその型のメソッドにまとめる
    related: [MDL-03, DDD-VO-03, BIZ-03]
    fixtures:
      violation: []
      borderline: []
      not_violation: []

  - id: MDL-05
    name: 別の概念を1つの型にまとめた誤った共通化がある
    principle: 別のコンテキスト・別の概念は、形が似ていても1つの型にまとめない
    principles: [mdl.no-false-unification]
    source: Metz "The Wrong Abstraction"／Evans『Domain-Driven Design』14章 Maintaining Model Integrity（Bounded Context）
    status: draft
    release: v1
    applies_when:
      layers: [domain, application]
      languages: [typescript, python]
      requires: [layer_map]
    detection:
      type: llm
      question: >-
        この型は、別のコンテキストか別の概念を1つにまとめたために、一部の利用者しか使わないフィールドや、
        利用者の種類による分岐を抱えているか。
    location: 型の宣言の行
    criteria:
      violation: 別のコンテキストか別の概念を1つの型にまとめた結果、片方の都合だけのフィールドや種別の分岐が増えている
      borderline: >-
        種別による分岐はあるが、それが同じ概念のバリエーション（ポリモーフィズムで表すもの）か、
        別の概念の混在かがコードだけでは決まらない
      not_violation: 共通化した型のフィールドと振る舞いを、すべての利用者が同じ意味で使っている
    exclusions:
      - テストコード
      - 共有カーネルとして合意済みであることが ADR か設定に書かれた型
    severity:
      default: Medium
    fix_patterns:
      - コンテキストか概念ごとに型を分け、本当に共通する部分だけを値オブジェクトとして共有する
      - 分けた型どうしの変換を、コンテキストの境界（アンチコラプション層）に置く
    related: [MDL-01, MDL-06, GLO-03]
    fixtures:
      violation: []
      borderline: []
      not_violation: []

  - id: MDL-06
    name: 共有カーネルにある型を再定義している
    principle: 共有カーネルとして定義した型は、再定義せずに import して使う
    principles: [mdl.shared-kernel, mdl.single-source-of-knowledge]
    source: Evans『Domain-Driven Design』14章 Maintaining Model Integrity（Shared Kernel）
    status: draft
    release: v1
    applies_when:
      layers: [domain, application, adapter, infrastructure]
      languages: [typescript, python]
      requires: [layer_map]
    detection:
      type: static
      static: >-
        共有カーネル（層マップで shared の層）にある型の名前とフィールド名の集合を集め、ほかの層にある型のうち、
        名前とフィールド名の集合が両方一致するもの、または名前が違ってもフィールド名の集合が完全に一致するものを列挙する
    location: 再定義した側の型の宣言の行
    criteria:
      violation: 共有カーネルの型と、名前とフィールド名の集合が一致する型、またはフィールド名の集合が完全に一致する型を、ほかの層で定義している
      borderline: 名前は同じだがフィールド名の集合が一致しない（別の意味の同名の型か、古くなった写しかが決まらない）
      not_violation: >-
        共有カーネルの型を import して使っている。共有カーネルの型をフィールドに持ち、
        別の振る舞いを足した別名の型
    exclusions:
      - テストコード
      - 外部 API の型の定義（生成コードを含む）
      - アンチコラプション層で外部の型を写し取っていることが、コメントか設定で明示された型
    severity:
      default: Low
    fix_patterns:
      - 再定義した型を削り、共有カーネルの型を import して使う
    related: [MDL-01, MDL-05]
    fixtures:
      violation: []
      borderline: []
      not_violation: []
